<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title> unbox inventory </title>
        <style>
            body {
                color: white;
            }
            .item-row:hover {
                color: black;
                background-color: aquamarine;
            }
            td img {
                width: 64px;
                height: 64px;
                object-fit: contain;
            }
        </style>
    </head>
    <body>
        <div class="overlay-token-container">
            <p> create a browser source with this url: </p>
            <input
                type="text"
                id="overlayTokenInput"
                size="80"
                name="overlay-token-input"
                value="••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••"
                readonly
            /> <br />
            <button id="resetOverlayTokenButton"> Reset </button>
            <button id="showOverlayTokenButton"> Show </button>
        </div>

        <div class="tab">
            <button class="tablinks" onclick="openTab(event, 'items')"> Items </button>
            <button class="tablinks" onclick="openTab(event, 'inventory')"> Inventory </button>
        </div>

        <div id="items" class="tabcontent">
            <table id="items-table">
                <thead>
                    <tr> <th> Name </th> <th> Description </th> <th> Image </th> <th> Rarity </th> <th></th> </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button command="show-modal" commandfor="add-item-dialog"> Add Item </button>
            <dialog id="add-item-dialog">
                <label for="add-item-name"> Item Name: </label>
                <input type="text" name="name" id="add-item-name" placeholder="Maddy Plush"/> <br />

                <label for="add-item-description"> Item Description: </label>
                <input type="textarea" name="description" id="add-item-description" placeholder="Super cool, really awesome, get while you can!"/> <br />

                <label for="add-item-image"> Item Image: </label>
                <input type="file" name="image" id="add-item-image"/> <br />

                <label for="add-item-rarity"> Item Rarity: </label>
                <select name="rarity" id="add-item-rarity">
                    <option value="common"> Common </option>
                    <option value="uncommon"> Uncommon </option>
                    <option value="rare"> Rare </option>
                    <option value="epic"> Epic </option>
                    <option value="legendary"> Legendary </option>
                </select> <br />

                <button id="add-item-submit"> Add Item </button>
                <button id="add-item-close" commandfor="add-item-dialog" command="close"> Cancel </button> <br />
                <!-- <span id="add-item-status-text">NAME EMPTY</span> -->
            </dialog>
        </div>

        <div id="inventory" class="tabcontent">
            <table id="inventory-table">
                <thead>
                    <tr> <th> User </th> <th> Name </th><th> Description </th> <th> Image </th> <th> Rarity </th> <th></th> </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
        <script>
            function openTab(event, name) {
                var i, tabcontent, tablinks;
                tabcontent = document.getElementsByClassName("tabcontent");
                for (i = 0; i < tabcontent.length; i++) {
                    tabcontent[i].style.display = "none";
                }
                tablinks = document.getElementsByClassName("tablinks");
                for (i = 0; i < tablinks.length; i++) {
                    tablinks[i].className = tablinks[i].className.replace(" active", "");
                }
                document.getElementById(name).style.display = "block";
                event.currentTarget.className += " active";
            }

            let overlayTokenInput = document.querySelector("#overlayTokenInput")
            let showOverlayToken = document.querySelector("#showOverlayTokenButton")
            let copyOverlayToken = document.querySelector("#copyOverlayTokenButton")
            let resetOverlayToken = document.querySelector("#resetOverlayTokenButton")

            var overlayToken;
            var twitchId;
            var isShowing = false

            var items = new Map()
            var users = new Map()

            showOverlayToken.addEventListener("click", event => {
                let url;

                if (isShowing) {
                    url = "••••••••••••••••••••••••••••••••••••••••••"
                    isShowing = false
                } else {
                    url = `https://colavt-unbox.coolify.maddy.fyi/overlay/${twitchId}/${overlayToken}`
                    isShowing = true
                }

                overlayTokenInput.value = url
            })

            // holding shift deletes without warning
            let isShiftHeld = false
            document.addEventListener("keydown", event => {
                if (event.key === "Shift" && !isShiftHeld) isShiftHeld = true
            })
            document.addEventListener("keyup", event => {
                if (event.key === "Shift" && isShiftHeld) isShiftHeld = false
            })

            Twitch.ext.onAuthorized(auth => {
                console.log(auth)

                get("broadcasters", auth.token)
                .then(broadcaster => {
                    overlayToken = broadcaster.overlay_token
                    twitchId = broadcaster.user_id
                })

                resetOverlayToken.addEventListener("click", event => {
                    get("overlay/new", auth.token)
                    .then(data => {
                        overlayToken = JSON.parse(data)
                    })
                })

                // add item dialog
                document.querySelector("#add-item-submit").addEventListener("click", event => {
                    let itemNameE = document.querySelector("#add-item-name")
                    let itemDescriptionE = document.querySelector("#add-item-description")
                    let itemImageE = document.querySelector("#add-item-image")
                    let itemRarityE = document.querySelector("#add-item-rarity")

                    // let statusText = document.querySelector("#add-item-status-text")

                    let data = new FormData()
                    data.append(itemNameE.name, itemNameE.value)
                    data.append(itemDescriptionE.name, itemDescriptionE.value)
                    data.append(itemImageE.name, itemImageE.files[0])
                    data.append(itemRarityE.name, itemRarityE.value)

                    itemNameE.value = null
                    itemDescriptionE.value = null
                    itemImageE.value = null
                    itemRarityE.selectedIndex = 0

                    post("items", auth.token, data).then(() => {
                        populateItemsTable(auth.token)
                    })
                }, false)

                document.addEventListener("load", () => {
                    populate(auth, main)
                })
            })

            function inventory_item_delete(inventoryItemId) {
                if (isShiftHeld) {
                    _delete(`inventory/${inventoryItemId}`, token).then(() => { populate(auth) })
                }
            }

            function populate(auth, callback) {
                populateItemsTable(auth)
                .then(() => {
                    populateInventoryTable(auth)
                    .then(calllback)
                    .catch(console.error)
                })
                .catch(console.error)
            }

            async function populateItemsTable(auth) {
                get("items", auth.token)
                .then(updateItemsTable)
                .then(() => {

                    // delete item button
                    document.querySelectorAll(".items-table-delete").forEach(button => {
                        button.addEventListener("click", event => {
                            if (isShiftHeld) {
                                let id = event.target.getAttribute("data-id")
                                _delete(`items/${id}`, token).then(() => {
                                    get("items", token).then(() => {
                                        populate(auth)
                                    })
                                })
                            }
                        })
                    }, false)
                })
            }

            async function updateItemsTable(json) {
                if (json.length == 0) return

                let body = document.querySelector("#items-table > tbody")
                body.replaceChildren()

                items.clear()

                for (let item of json) {
                    items.set(item.id, item)

                    let imageUrlPath = `https://colavt-unbox.coolify.maddy.fyi/${item.image_url}`
                    let row = body.insertRow()
                    row.innerHTML = `
                        <td> ${item.name} </td>
                        <td> ${item.description} </td>
                        <td> <img src="${imageUrlPath}" /> </td>
                        <td> ${item.rarity} </td>
                        <td> <button data-id="${item.id}" class="items-table-delete"> Delete </button> </td>
                    `

                    row.classList.add("item-row")

                    // <td> <button class="items-table-edit"> Edit </button> </td>
                    // row.querySelector("#items-table-edit").addEventListener("click", editItemsTable, false)
                }
            }

            async function populateInventoryTable(auth) {
                get("inventory/all", auth.token)
                .then(json => {
                    updateInventoryTable(json, auth)
                })
                .then(() => {
                    document.querySelectorAll(".inventory-table-delete").forEach(button => {
                        console.log("delete button clicked")
                        button.addEventListener("click", event => {
                            if (isShiftHeld) {
                                let id = event.target.getAttribute("data-id")
                                _delete(`inventory/${id}`, token).then(() => {
                                    get("inventory", token).then(() => {
                                        populate(auth)
                                    })
                                })
                            }
                        })
                    }, false)
                })
            }

            async function updateInventoryTable(json, auth) {
                if (json.length == 0) return
                console.log(json)

                let body = document.querySelector("#inventory-table > tbody")
                body.replaceChildren()
                
                for (let invItem of json) {
                    let item = items.get(invItem.item_id)
                    console.log("item:", item)
                    console.log("invItem:", invItem)

                    let displayName
                    if (users.has(invItem.user_id)) {
                        console.log("existing user")
                        displayName = users.get(invItem.user_id)
                        if (displayName === undefined) console.error(`undefined in users for ${invItem.user_id}`)
                    } else {
                        console.log("new user")
                        let user = await get_twitch_user(invItem.user_id, auth.helixToken)
                        displayName = user.data[0].display_name
                        users.set(invItem.user_id, displayName)
                        console.log(`cached ${users.get(invItem.user_id)}`)
                    }

                    // BUG: sometimes this'll load before the items have
                    let imageUrlPath = `https://colavt-unbox.coolify.maddy.fyi/${item.image_url}`
                    let row = body.insertRow()
                    row.innerHTML = `
                        <td> ${displayName} </td>
                        <td> ${item.name} </td>
                        <td> ${item.description} </td>
                        <td> <img src="${imageUrlPath}" /> </td>
                        <td> ${item.rarity} </td>
                        <td> <button onclick="inventory_item_delete(${invItem.id})" data-id="${invItem.id}" class="inventory-table-delete"> Delete </button> </td>
                    `

                    row.classList.add("item-row")
                }
            }

            async function get_twitch_user(userId, token) {
                const url = `https://api.twitch.tv/helix/users?id=${userId}`

                try {
                    const response = await fetch(url, {
                        method: "GET",
                        mode: "cors",
                        headers: {
                            "Authorization": `Extension ${token}`,
                            "Client-Id": "h2f87wny0eleqoc0orckxyb7li1eqo"
                        }
                    })

                    if (!response.ok) {
                        throw new Error(`Response status: ${response.status}`)
                    }

                    return await response.json()
                } catch (error) {
                    console.error(error)
                }
            }

            async function _delete(route, token) {
                const url = `https://colavt-unbox.coolify.maddy.fyi/api/${route}`

                try {
                    const response = await fetch(url, {
                        method: "DELETE",
                        mode: "cors",
                        headers: {"Authorization": `Bearer ${token}`}
                    })

                    if (!response.ok) {
                        throw new Error(`Response status: ${response.status}`)
                    }
                    
                    return
                } catch (error) {
                    console.error(error)
                }
            }

            async function post(route, token, data) {
                const url = `https://colavt-unbox.coolify.maddy.fyi/api/${route}`

                try {
                    const response = await fetch(url, {
                        method: "POST",
                        mode: "cors",
                        headers: {"Authorization": `Bearer ${token}`},
                        body: data
                    })

                    if (!response.ok) {
                        throw new Error(`Response status: ${response.status}`)
                    }
                    
                    return
                } catch (error) {
                    console.error(error)
                }
            }

            async function get(route, token) {
                const url = `https://colavt-unbox.coolify.maddy.fyi/api/${route}`
                
                try {
                    const response = await fetch(url, {
                        method: "GET",
                        mode: "cors",
                        headers: {"Authorization": `Bearer ${token}`},
                    })

                    if (!response.ok) {
                        throw new Error(`Response status: ${response.status}`)
                    }

                    return await response.json()
                } catch (error) {
                    console.error(error)
                }
            }
        </script>
    </body>
</html>
